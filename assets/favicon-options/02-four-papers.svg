<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Four papers grid favicon">
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #FAFAFA; }
    .cell { fill: #FAFAFA; }
    .stroke { stroke: #0A0A0A; }
    .accent { fill: #DC2626; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0A0A0A; }
      .cell { fill: #0A0A0A; }
      .stroke { stroke: #FAFAFA; }
      .accent { fill: #EF4444; }
    }
  </style>
  <rect class="bg" width="32" height="32" />
  <rect class="cell" x="0" y="0" width="16" height="16" />
  <rect class="cell" x="16" y="0" width="16" height="16" />
  <rect class="cell" x="0" y="16" width="16" height="16" />
  <rect class="accent" x="16" y="16" width="16" height="16" />
  <rect class="stroke" x="0.5" y="0.5" width="31" height="31" fill="none" stroke-width="1" />
  <line class="stroke" x1="16" y1="0" x2="16" y2="32" stroke-width="1" />
  <line class="stroke" x1="0" y1="16" x2="32" y2="16" stroke-width="1" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Band score 7 favicon">
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #FAFAFA; }
    .fg { fill: #0A0A0A; }
    .accent { fill: #DC2626; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0A0A0A; }
      .fg { fill: #FAFAFA; }
      .accent { fill: #EF4444; }
    }
  </style>
  <rect class="bg" width="32" height="32" />
  <text
    class="fg"
    x="14.5"
    y="16.5"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="24"
    font-weight="700"
    letter-spacing="-0.04em"
  >7</text>
  <circle class="accent" cx="23" cy="22" r="2" />
</svg>

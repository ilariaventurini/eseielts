[build]
  command = "yarn build"
  publish = "dist"

# Run `yarn dev:netlify` (or `netlify dev`) locally so /.netlify/functions/* is available.
# Plain `yarn dev` only starts Vite — feedback requests will 404 without VITE_GEMINI_FEEDBACK_URL.
#
# Use an empty publish dir for local dev so we do not load dist/_redirects (SPA rewrite would
# break Vite module URLs like /src/main.tsx). Production SPA routing lives in public/_redirects.
[dev]
  command = "yarn dev"
  port = 8888
  targetPort = 5173
  publish = "dev-publish"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Task 1 sends a downloaded image to Gemini; cold start + multimodal can exceed the default limit.
# Timeout is in seconds. Deployed sites: must be within your plan’s synchronous function limit (redeploy after changes).
# netlify dev may still cap simulated function duration (~30s) unless the project is linked to a site with a higher limit.
[functions."gemini-feedback"]
  timeout = 60

[functions."gemini-writing-solution"]
  timeout = 60
